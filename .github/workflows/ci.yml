name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t evertool:ci .

      - name: Refuses to start without SECRET_KEY
        run: |
          if docker run --rm evertool:ci python -c "import app" 2>/dev/null; then
            echo "::error::app imported without SECRET_KEY"; exit 1
          fi

      - name: Unit tests
        run: docker run --rm evertool:ci python -m unittest discover -s tests -v

      - name: Smoke test
        run: |
          docker run -d --name evertool-ci -p 8080:8080 -e SECRET_KEY=ci-not-a-real-secret evertool:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          for path in / /tool/qr/ /tool/pdf/ /tool/mask/; do
            curl -fsS -o /dev/null "http://127.0.0.1:8080$path" || { docker logs evertool-ci; exit 1; }
          done
          curl -fsS -X POST -d 'url=https://example.com&background=transparent' http://127.0.0.1:8080/tool/qr/generate | grep -q 'data:image/png;base64' \
            || { echo "::error::QR generation failed"; docker logs evertool-ci; exit 1; }
          docker run --rm evertool:ci python -c "import io, sys; from PIL import Image; b = io.BytesIO(); Image.new('RGB', (200, 100), 'white').save(b, 'PDF'); sys.stdout.buffer.write(b.getvalue())" > ci.pdf
          curl -fsS -F 'pdf=@ci.pdf' http://127.0.0.1:8080/tool/pdf/convert | grep -q 'page_1.png' \
            || { echo "::error::PDF conversion failed"; docker logs evertool-ci; exit 1; }
          docker rm -f evertool-ci
